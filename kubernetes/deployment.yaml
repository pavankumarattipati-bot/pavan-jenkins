apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins

spec:
  replicas: 1

  selector:
    matchLabels:
      app: jenkins

  template:
    metadata:
      labels:
        app: jenkins

    spec:
      securityContext:
        fsGroup: 1000

      containers:
        - name: jenkins
          image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_REGION.amazonaws.com/jenkins-custom:latest

          ports:
            - containerPort: 8080
              name: http

            - containerPort: 50000
              name: agent

          volumeMounts:
            - name: jenkins-storage
              mountPath: /var/jenkins_home

          resources:
            requests:
              cpu: 500m
              memory: 1Gi

            limits:
              cpu: 1000m
              memory: 2Gi

      volumes:
        - name: jenkins-storage
          persistentVolumeClaim:
            claimName: jenkins-pvc
